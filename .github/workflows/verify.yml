name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-linux:
    name: Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Install build and validation dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git base-devel rust gtk4 libadwaita unzip
          desktop-file-utils libxml2 shellcheck

      # 容器内步骤以 root 运行，而工作区文件属于宿主机 uid；不显式信任的话，
      # git 会拒绝把检出目录当成仓库（本仓库的这一步从未真正成功过）。
      - name: Trust the checked-out workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # 让最后一步能看到被推送提交与其父提交的差异，否则工作树永远"干净"。
          fetch-depth: 2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap.sh scripts/install.sh
          bash -n tests/bootstrap.sh tests/install_uninstall.sh
          shellcheck scripts/bootstrap.sh scripts/install.sh
          shellcheck tests/bootstrap.sh tests/install_uninstall.sh
          tests/bootstrap.sh
          tests/install_uninstall.sh

      - name: Validate desktop metadata and XML
        run: |
          desktop-file-validate data/io.github.pang.RjSupplicantGui.desktop
          xmllint --noout data/io.github.pang.RjSupplicantGui.svg
          xmllint --noout data/io.github.pang.RjSupplicantGui.policy

      - name: Check whitespace errors
        run: |
          # 直接扫描检出内容而不是 git diff --check：前者不依赖 .git 是否可用，
          # 且覆盖所有文本文件（当前仓库干净，因此这条不会因历史遗留而失败）。
          matches="$(grep -rlE \
            --include='*.rs' --include='*.sh' --include='*.md' --include='*.toml' \
            --include='*.yml' --include='*.policy' --include='*.desktop' --include='.gitignore' \
            --exclude-dir=target --exclude-dir=.git \
            '[[:space:]]+$' . || true)"
          if [ -n "${matches}" ]; then
            printf '以下文件存在行尾空白：\n%s\n' "${matches}"
            exit 1
          fi
          if git rev-parse -q --verify 'HEAD^' >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi
