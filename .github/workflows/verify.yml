name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-linux:
    name: Arch Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Install build and validation dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          git base-devel rust gtk4 libadwaita unzip
          desktop-file-utils libxml2 shellcheck

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # 让最后一步能看到被推送提交与其父提交的差异，否则工作树永远"干净"。
          fetch-depth: 2

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Rust tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release

      - name: Validate shell scripts
        run: |
          bash -n scripts/bootstrap.sh scripts/install.sh
          bash -n tests/bootstrap.sh tests/install_uninstall.sh
          shellcheck scripts/bootstrap.sh scripts/install.sh
          shellcheck tests/bootstrap.sh tests/install_uninstall.sh
          tests/bootstrap.sh
          tests/install_uninstall.sh

      - name: Validate desktop metadata and XML
        run: |
          desktop-file-validate data/io.github.pang.RjSupplicantGui.desktop
          xmllint --noout data/io.github.pang.RjSupplicantGui.svg
          xmllint --noout data/io.github.pang.RjSupplicantGui.policy

      - name: Check whitespace errors
        run: |
          if git rev-parse -q --verify 'HEAD^' >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi
